{% extends 'tournaments/base.html' %}
{% block title %}// Создать команду{% endblock %}
{% block content %}
<div class="container py-5">
    <div class="row justify-content-center">
        <div class="col-md-6">
            <div class="card p-4">
                <h2 class="text-center mb-4" style="color: var(--neon-cyan);">// СОЗДАТЬ КОМАНДУ</h2>
                <form method="POST" enctype="multipart/form-data">
                    {% csrf_token %}
                    {{ form.as_p }}
                    <button type="submit" class="btn-primary w-100">▸ СОЗДАТЬ</button>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}
